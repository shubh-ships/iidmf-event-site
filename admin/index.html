<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Registrations | IIDMF 2026 admin</title>
<style>
  :root {
    --plum: #5a2148; --plum-deep: #3d1430; --cream: #fbf4e8; --paper: #fff;
    --ink: #2b1726; --muted: #6b5562; --line: #e7d8c4; --marigold: #f2b544; --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: var(--ink); background: var(--cream); }
  button, input, select { font: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--marigold); outline-offset: 2px; }

  header { background: var(--plum-deep); color: #fff; }
  .bar { max-width: 80rem; margin: 0 auto; padding: .75rem 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .bar h1 { margin: 0; font: 700 1.1rem/1.2 Georgia, serif; }
  .bar .who { font-size: .9rem; color: #e9c9da; display: flex; align-items: center; gap: .75rem; }
  main { max-width: 80rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 2.5rem; padding: .45rem 1rem; border-radius: 8px; border: 1.5px solid var(--plum); background: var(--plum); color: #fff; font-weight: 600; cursor: pointer; }
  .btn:hover { background: var(--plum-deep); }
  .btn.ghost { background: transparent; color: var(--plum); }
  .btn.ghost:hover { background: var(--plum); color: #fff; }
  .btn.light { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); min-height: 2.1rem; padding: .25rem .75rem; }
  .btn[disabled] { opacity: .55; cursor: progress; }

  /* Login */
  .login { max-width: 24rem; margin: 10vh auto 0; background: var(--paper); border: 1px solid var(--line); border-top: 6px solid var(--plum); border-radius: 12px; padding: 1.75rem; }
  .login h2 { margin: 0 0 1rem; font: 700 1.4rem Georgia, serif; color: var(--plum); }
  label { display: block; font-weight: 600; margin: .9rem 0 .3rem; }
  input[type=email], input[type=password], input[type=search], select {
    width: 100%; min-height: 2.6rem; padding: .45rem .7rem; border: 1.5px solid #cdbba6; border-radius: 8px; background: #fff; color: var(--ink);
  }
  .login .btn { width: 100%; margin-top: 1.25rem; }
  .msg { margin: .9rem 0 0; color: var(--danger); font-weight: 500; }
  .msg:empty { display: none; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .75rem; margin-bottom: 1.25rem; }
  .stat { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: .8rem 1rem; }
  .stat b { display: block; font: 700 1.7rem/1.1 Georgia, serif; color: var(--plum); }
  .stat span { color: var(--muted); font-size: .9rem; }

  /* Toolbar */
  .tools { display: flex; flex-wrap: wrap; gap: .75rem; align-items: flex-end; margin-bottom: 1rem; }
  .tools .grow { flex: 1 1 16rem; }
  .tools label { margin-top: 0; font-size: .85rem; color: var(--muted); }
  .tools select { width: auto; min-width: 11rem; }

  /* Table */
  .table-wrap { overflow-x: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; min-width: 60rem; }
  th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { position: sticky; top: 0; background: #f6ecdf; font-size: .85rem; color: var(--muted); font-weight: 600; white-space: nowrap; }
  tbody tr:hover { background: #fdf8f0; }
  td.code { font-family: ui-monospace, Consolas, monospace; font-weight: 600; color: var(--plum); white-space: nowrap; }
  td.num { text-align: right; }
  td.nowrap { white-space: nowrap; }
  .empty { padding: 2.5rem 1rem; text-align: center; color: var(--muted); }

  .pager { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: .9rem; color: var(--muted); font-size: .9rem; flex-wrap: wrap; }
  .pager div { display: flex; gap: .5rem; }
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1>IIDMF 2026 · Registrations</h1>
    <div class="who" id="who" hidden>
      <span id="whoEmail"></span>
      <button class="btn light" id="logout" type="button">Sign out</button>
    </div>
  </div>
</header>

<!-- ============ Sign in ============ -->
<section class="login" id="loginView" hidden>
  <h2>Sign in</h2>
  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit" id="loginBtn">Sign in</button>
    <p class="msg" id="loginMsg" role="alert"></p>
  </form>
</section>

<!-- ============ Dashboard ============ -->
<main id="appView" hidden>
  <div class="stats" id="stats" aria-live="polite">
    <div class="stat"><b id="sRegs">–</b><span>Registrations</span></div>
    <div class="stat"><b id="sPeople">–</b><span>People expected (all evenings)</span></div>
    <div class="stat"><b id="sD1">–</b><span>People on Fri, 4 Dec</span></div>
    <div class="stat"><b id="sD2">–</b><span>People on Sat, 5 Dec</span></div>
    <div class="stat"><b id="sD3">–</b><span>People on Sun, 6 Dec</span></div>
  </div>

  <div class="tools">
    <div class="grow">
      <label for="q">Search name, email, mobile or pass code</label>
      <input id="q" type="search" placeholder="e.g. IIDMF-K7QX3M or 98765">
    </div>
    <div>
      <label for="day">Evening</label>
      <select id="day">
        <option value="">All evenings</option>
        <option value="2026-12-04">Fri, 4 Dec</option>
        <option value="2026-12-05">Sat, 5 Dec</option>
        <option value="2026-12-06">Sun, 6 Dec</option>
      </select>
    </div>
    <button class="btn ghost" type="button" id="refresh">Refresh</button>
    <button class="btn" type="button" id="export">Download CSV</button>
  </div>

  <p class="msg" id="appMsg" role="alert"></p>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th scope="col">Pass code</th>
          <th scope="col">Name</th>
          <th scope="col">Email</th>
          <th scope="col">Mobile</th>
          <th scope="col">City</th>
          <th scope="col">Evenings</th>
          <th scope="col">People</th>
          <th scope="col">Registered</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="pager">
    <span id="pageInfo"></span>
    <div>
      <button class="btn ghost" type="button" id="prev">Previous</button>
      <button class="btn ghost" type="button" id="next">Next</button>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  'use strict';

  // ====== Set these two values (both are safe to publish) ======
  var SUPABASE_URL = 'https://YOUR-PROJECT-REF.supabase.co';
  var SUPABASE_ANON_KEY = 'YOUR-ANON-OR-PUBLISHABLE-KEY';
  // =============================================================

  var PAGE_SIZE = 50;
  var COLUMNS = 'ticket_code, full_name, email, phone, city, days, attendees, created_at';
  var DAY_SHORT = { '2026-12-04': 'Fri 4', '2026-12-05': 'Sat 5', '2026-12-06': 'Sun 6' };

  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var page = 0, total = 0, searchTimer = null;

  function $(id) { return document.getElementById(id); }
  var fmtDate = new Intl.DateTimeFormat('en-IN', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Kolkata' });

  /* ---------------- Auth ---------------- */
  function showLogin(msg) {
    $('appView').hidden = true; $('who').hidden = true; $('loginView').hidden = false;
    $('loginMsg').textContent = msg || '';
  }
  function showApp(session) {
    $('loginView').hidden = true; $('appView').hidden = false; $('who').hidden = false;
    $('whoEmail').textContent = session.user.email;
    loadAll();
  }

  $('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    $('loginMsg').textContent = '';
    $('loginBtn').disabled = true; $('loginBtn').textContent = 'Signing in…';
    var res = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    $('loginBtn').disabled = false; $('loginBtn').textContent = 'Sign in';
    if (res.error) { $('loginMsg').textContent = 'Wrong email or password.'; return; }
    $('password').value = '';
    showApp(res.data.session);
  });

  $('logout').addEventListener('click', async function () {
    await sb.auth.signOut();
    $('rows').innerHTML = '';
    showLogin();
  });

  /* ---------------- Data ---------------- */
  function cleanSearch(v) {
    // characters that would break the PostgREST filter syntax
    return v.trim().replace(/[,()*%\\:"]/g, ' ').replace(/\s+/g, ' ').slice(0, 60);
  }

  function filtered(query) {
    var q = cleanSearch($('q').value);
    var day = $('day').value;
    if (day) query = query.contains('days', [day]);
    if (q) {
      var digits = q.replace(/\D/g, '');
      var parts = ['full_name.ilike.*' + q + '*', 'email.ilike.*' + q + '*', 'ticket_code.ilike.*' + q + '*'];
      if (digits.length >= 3) parts.push('phone.ilike.*' + digits + '*');
      query = query.or(parts.join(','));
    }
    return query;
  }

  async function loadStats() {
    var res = await sb.rpc('registration_stats');
    if (res.error) {
      if (res.error.code === '42501') {
        await sb.auth.signOut();
        showLogin('This account isn’t on the admin list. Ask the site owner to add it.');
        return false;
      }
      $('appMsg').textContent = 'Could not load totals: ' + res.error.message;
      return true;
    }
    var s = res.data || {}, by = s.by_day || {};
    var n = function (x) { return Number(x || 0).toLocaleString('en-IN'); };
    $('sRegs').textContent = n(s.registrations);
    $('sPeople').textContent = n(s.attendees);
    $('sD1').textContent = n(by['2026-12-04']);
    $('sD2').textContent = n(by['2026-12-05']);
    $('sD3').textContent = n(by['2026-12-06']);
    return true;
  }

  async function loadRows() {
    $('appMsg').textContent = '';
    var from = page * PAGE_SIZE;
    var query = filtered(sb.from('registrations').select(COLUMNS, { count: 'exact' }))
      .order('created_at', { ascending: false })
      .range(from, from + PAGE_SIZE - 1);
    var res = await query;
    if (res.error) { $('appMsg').textContent = 'Could not load registrations: ' + res.error.message; return; }
    total = res.count || 0;
    render(res.data || []);
    var last = Math.min(from + PAGE_SIZE, total);
    $('pageInfo').textContent = total ? ('Showing ' + (from + 1) + '–' + last + ' of ' + total.toLocaleString('en-IN')) : '';
    $('prev').disabled = page === 0;
    $('next').disabled = last >= total;
  }

  async function loadAll() {
    var ok = await loadStats();
    if (ok) await loadRows();
  }

  function cell(tr, text, cls) {
    var td = document.createElement('td');
    td.textContent = text == null ? '' : String(text); // textContent: never render user input as HTML
    if (cls) td.className = cls;
    tr.appendChild(td);
  }

  function daysText(days) { return (days || []).map(function (d) { return DAY_SHORT[d] || d; }).join(', '); }

  function render(rows) {
    var tbody = $('rows');
    tbody.innerHTML = '';
    if (!rows.length) {
      var tr = document.createElement('tr'), td = document.createElement('td');
      td.colSpan = 8; td.className = 'empty';
      td.textContent = $('q').value || $('day').value ? 'No registrations match this search.' : 'No registrations yet. They’ll appear here as people sign up.';
      tr.appendChild(td); tbody.appendChild(tr);
      return;
    }
    rows.forEach(function (r) {
      var tr = document.createElement('tr');
      cell(tr, r.ticket_code, 'code');
      cell(tr, r.full_name);
      cell(tr, r.email);
      cell(tr, r.phone, 'nowrap');
      cell(tr, r.city);
      cell(tr, daysText(r.days), 'nowrap');
      cell(tr, r.attendees, 'num');
      cell(tr, fmtDate.format(new Date(r.created_at)), 'nowrap');
      tbody.appendChild(tr);
    });
  }

  $('q').addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { page = 0; loadRows(); }, 300);
  });
  $('day').addEventListener('change', function () { page = 0; loadRows(); });
  $('refresh').addEventListener('click', loadAll);
  $('prev').addEventListener('click', function () { if (page > 0) { page--; loadRows(); } });
  $('next').addEventListener('click', function () { page++; loadRows(); });

  /* ---------------- CSV export (current filters) ---------------- */
  function csvCell(v) {
    var s = v == null ? '' : String(v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // stop spreadsheet formula injection
    return '"' + s.replace(/"/g, '""') + '"';
  }

  $('export').addEventListener('click', async function () {
    var btn = $('export');
    btn.disabled = true; btn.textContent = 'Preparing…';
    $('appMsg').textContent = '';
    try {
      var all = [], from = 0, chunk = 1000;
      while (true) {
        var res = await filtered(sb.from('registrations').select(COLUMNS))
          .order('created_at', { ascending: true })
          .range(from, from + chunk - 1);
        if (res.error) throw res.error;
        all = all.concat(res.data);
        if (res.data.length < chunk) break;
        from += chunk;
      }
      var header = ['Pass code', 'Name', 'Email', 'Mobile', 'City', 'Fri 4 Dec', 'Sat 5 Dec', 'Sun 6 Dec', 'People', 'Registered (IST)'];
      var lines = [header.map(csvCell).join(',')];
      all.forEach(function (r) {
        var d = r.days || [];
        lines.push([
          r.ticket_code, r.full_name, r.email, r.phone, r.city,
          d.indexOf('2026-12-04') > -1 ? 'Yes' : '',
          d.indexOf('2026-12-05') > -1 ? 'Yes' : '',
          d.indexOf('2026-12-06') > -1 ? 'Yes' : '',
          r.attendees, fmtDate.format(new Date(r.created_at))
        ].map(csvCell).join(','));
      });
      var blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      var stamp = new Date().toISOString().slice(0, 10);
      a.href = URL.createObjectURL(blob);
      a.download = 'iidmf-2026-registrations-' + stamp + ($('day').value ? '-' + $('day').value : '') + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    } catch (err) {
      $('appMsg').textContent = 'Could not export: ' + (err.message || err);
    } finally {
      btn.disabled = false; btn.textContent = 'Download CSV';
    }
  });

  /* ---------------- Start ---------------- */
  if (SUPABASE_URL.indexOf('YOUR-PROJECT-REF') !== -1) {
    showLogin('Set SUPABASE_URL and SUPABASE_ANON_KEY in this file first.');
    return;
  }
  sb.auth.getSession().then(function (r) {
    if (r.data.session) showApp(r.data.session); else showLogin();
  });
  sb.auth.onAuthStateChange(function (event) {
    if (event === 'SIGNED_OUT') showLogin();
  });
})();
</script>
</body>
</html>
