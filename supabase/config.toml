# Only the part relevant to this project. If you already have a config.toml
# from `supabase init`, add this block to it.

[functions.register]
# The public form has no login, so the function does its own checks
# (allowed origins, validation, rate limit) instead of requiring a JWT.
verify_jwt = false

[functions.admin]
# The admin function does its own login check (username + password secret),
# so Supabase's JWT check is switched off here too.
verify_jwt = false
